name: build
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Versionen fuer Minecraft 26.3 nachschlagen
        id: v
        run: |
          MC=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)
          API=$(curl -fsSL https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml \
            | grep -o "<version>[^<]*+${MC}</version>" | sed 's/<[^>]*>//g' | tail -1)
          LOADER=$(curl -fsSL https://meta.fabricmc.net/v2/versions/loader | python3 -c "import json,sys;print(next(v['version'] for v in json.load(sys.stdin) if v['stable']))")
          LOOM=$(curl -fsSL https://maven.fabricmc.net/net/fabricmc/fabric-loom/net.fabricmc.fabric-loom.gradle.plugin/maven-metadata.xml \
            | grep -o '<version>[^<]*</version>' | sed 's/<[^>]*>//g' | tail -1 || true)
          echo "MC=$MC API=$API LOADER=$LOADER LOOM=$LOOM"
          if [ -z "$API" ]; then echo "::error::Keine Fabric-API-Version fuer Minecraft $MC gefunden"; exit 1; fi
          echo "args=-Pfabric_api_version=$API -Ploader_version=$LOADER ${LOOM:+-Ploom_version=$LOOM}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          set +e
          gradle build --no-daemon --stacktrace ${{ steps.v.outputs.args }} 2>&1 | tee build.log
          RC=${PIPESTATUS[0]}
          if [ $RC -ne 0 ]; then
            grep -E -A3 "error:|What went wrong" build.log | grep -v "^--" | head -30 | while read -r l; do echo "::error::${l//%/%25}"; done
          fi
          exit $RC

      - name: Diagnose (nur bei Fehler)
        if: failure()
        run: |
          JAR=$(find "$PWD/.gradle/loom-cache" -name 'minecraft-merged*.jar' | head -1)
          mkdir -p /tmp/mc && cd /tmp/mc && unzip -q -o "$JAR" 'net/*'
          grep -rl "HAPPY_GHAST" net | head -5 | while read -r l; do echo "::error::HG-class $l"; done
          grep -rl "happy_ghast" net | head -8 | while read -r l; do echo "::error::hg-lower $l"; done
          javap -c -p -cp /tmp/mc net.minecraft.server.level.ServerPlayer net.minecraft.data.tags.EntityTypeTagsProvider | grep -i "HAPPY_GHAST" | sort -u | head -5 | while read -r l; do echo "::error::REF $l"; done

      - uses: actions/upload-artifact@v4
        with:
          name: happyghastharness
          path: build/libs/*.jar

      - name: Release erstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v sources | head -1)
          gh release create "build-${{ github.run_number }}" "$JAR" --prerelease \
            --title "Build ${{ github.run_number }}" --notes "Automatisch gebaut aus ${{ github.sha }}"
